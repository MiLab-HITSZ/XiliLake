<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>分类编辑 - 多模态大模型可信评测系统-西丽湖v0.1</title>
    <style>
        :root{
            --bg:#f4f7fb;--panel:#fff;--ink:#111827;--muted:#64748b;--line:#dbe3ee;
            --primary:#2458e6;--primary-soft:#eaf0ff;--success:#16803c;--danger:#b42318;
        }
        *{box-sizing:border-box;}
        body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;}
        button,input,textarea{font:inherit;letter-spacing:0;}
        button{cursor:pointer;}
        .topbar{min-height:76px;padding:14px 22px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:18px;}
        .title-wrap{min-width:0;}
        h1{margin:0;font-size:24px;font-weight:850;letter-spacing:0;}
        .header-meta{margin-top:5px;color:var(--muted);font-size:12px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
        .status{font-weight:700;}
        .status.dirty{color:#9a6700;}.status.saved{color:var(--success);}.status.error{color:var(--danger);}
        .actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
        .button,.link-button{min-height:38px;border:1px solid var(--line);background:#fff;color:#334155;padding:8px 13px;border-radius:6px;text-decoration:none;font-weight:750;font-size:13px;display:inline-flex;align-items:center;justify-content:center;}
        .button:hover,.link-button:hover{border-color:#aab8ca;background:#f8fafc;}
        .button.primary{border-color:var(--primary);background:var(--primary);color:#fff;}
        .button.danger{color:var(--danger);}
        .button:disabled{opacity:.55;cursor:not-allowed;}
        .workspace{height:calc(100vh - 76px);min-height:620px;display:grid;grid-template-columns:220px 270px 320px minmax(0,1fr);max-width:1900px;margin:0 auto;background:#fff;border-left:1px solid var(--line);border-right:1px solid var(--line);}
        .pane{min-width:0;overflow:auto;background:#fff;}
        .pane + .pane{border-left:1px solid var(--line);}
        .pane-head{position:sticky;top:0;z-index:2;background:#fff;border-bottom:1px solid var(--line);padding:16px;}
        .pane-head h2{font-size:14px;margin:0;font-weight:850;}
        .pane-head .meta{margin-top:4px;color:var(--muted);font-size:12px;}
        .nav-list{padding:8px;display:grid;gap:5px;}
        .nav-item{width:100%;min-height:54px;border:1px solid transparent;background:#fff;border-radius:6px;padding:8px 10px;text-align:left;display:flex;justify-content:space-between;align-items:center;gap:10px;}
        .nav-item:hover{background:#f7f9fc;border-color:var(--line);}
        .nav-item.active{background:var(--primary-soft);border-color:#bfd0ff;color:#1746c0;}
        .nav-name{font-size:13px;font-weight:780;line-height:1.35;overflow-wrap:anywhere;}
        .nav-count{flex:0 0 auto;color:var(--muted);font-size:11px;}
        .dimension-row{display:grid;grid-template-columns:minmax(0,1fr) 30px 30px;gap:4px;align-items:stretch;}
        .dimension-row .nav-item{min-width:0;}
        .order-button,.order-reset{border:1px solid var(--line);background:#fff;color:#475569;border-radius:5px;display:inline-flex;align-items:center;justify-content:center;font-weight:850;}
        .order-button{width:30px;min-height:30px;align-self:center;font-size:15px;}
        .order-button:hover,.order-reset:hover{border-color:#91a4bc;background:#f8fafc;color:#1e40af;}
        .order-button:disabled{opacity:.3;cursor:not-allowed;}
        .pane-title-row{display:flex;align-items:center;justify-content:space-between;gap:8px;}
        .order-reset{width:28px;height:28px;font-size:16px;}
        .search{width:100%;height:38px;margin-top:10px;border:1px solid var(--line);border-radius:5px;padding:8px 10px;color:var(--ink);outline:none;}
        .search:focus,.field input:focus,.field textarea:focus{border-color:#7ea0ff;box-shadow:0 0 0 3px rgba(36,88,230,.10);}
        .editor-pane{padding:0 28px 40px;}
        .editor-section{padding:24px 0 28px;border-bottom:1px solid var(--line);}
        .editor-section:last-child{border-bottom:0;}
        .editor-title{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:18px;}
        .editor-title h2{margin:0;font-size:19px;font-weight:850;}
        .editor-title .identifier{margin-top:5px;color:var(--muted);font:11px/1.4 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;overflow-wrap:anywhere;}
        .field{margin-top:16px;}
        .field:first-of-type{margin-top:0;}
        .field label{display:flex;justify-content:space-between;gap:12px;margin-bottom:7px;font-size:12px;font-weight:800;color:#334155;}
        .field .counter{font-weight:500;color:var(--muted);}
        .field input,.field textarea{width:100%;border:1px solid var(--line);border-radius:5px;background:#fff;padding:10px 11px;color:var(--ink);outline:none;line-height:1.65;resize:vertical;}
        .field input{height:43px;}
        .field textarea.group-description{min-height:150px;}
        .field textarea.dimension-intro{min-height:230px;}
        .benchmarks{margin-top:18px;border-top:1px dashed var(--line);padding-top:16px;}
        .benchmarks h3{margin:0 0 9px;font-size:12px;color:#475569;font-weight:850;}
        .benchmark-list{display:flex;gap:7px;flex-wrap:wrap;}
        .benchmark-name{border:1px solid #cfd8e5;background:#f8fafc;color:#334155;border-radius:4px;padding:5px 8px;font-size:12px;font-weight:700;}
        .empty{padding:28px 16px;color:#94a3b8;font-size:13px;}
        @media(max-width:1100px){
            .workspace{height:auto;min-height:calc(100vh - 76px);grid-template-columns:210px 250px 300px minmax(420px,1fr);overflow:auto;}
        }
        @media(max-width:760px){
            .topbar{align-items:flex-start;flex-direction:column;}
            .actions{width:100%;}.button,.link-button{flex:1 1 auto;}
            .workspace{height:auto;display:block;border:0;}
            .pane{max-height:none;border-bottom:1px solid var(--line);}
            .pane + .pane{border-left:0;}
            .nav-list{grid-template-columns:repeat(2,minmax(0,1fr));}
            .editor-pane{padding:0 16px 30px;}
        }
    </style>
</head>
<body>
    <header class="topbar">
        <div class="title-wrap">
            <h1>评测分类编辑</h1>
            <div class="header-meta">
                <span id="catalog-count">加载中...</span>
                <span class="status" id="save-status">正在读取</span>
            </div>
        </div>
        <div class="actions">
            <a class="link-button" href="/">访客模式</a>
            <button class="button danger" type="button" id="reset-all" onclick="resetAll()">恢复全部默认值</button>
            <button class="button primary" type="button" id="save-all" onclick="saveAll()">保存并发布</button>
        </div>
    </header>

    <main class="workspace">
        <section class="pane">
            <div class="pane-head">
                <h2>评测领域</h2>
                <div class="meta" id="domain-count"></div>
            </div>
            <div class="nav-list" id="domain-list"><div class="empty">加载中...</div></div>
        </section>

        <section class="pane">
            <div class="pane-head">
                <h2>大类</h2>
                <div class="meta" id="group-count"></div>
            </div>
            <div class="nav-list" id="group-list"><div class="empty">加载中...</div></div>
        </section>

        <section class="pane">
            <div class="pane-head">
                <div class="pane-title-row">
                    <h2>子类</h2>
                    <button class="order-reset" type="button" title="恢复当前大类的默认子类顺序" aria-label="恢复当前大类的默认子类顺序" onclick="resetDimensionOrder()">↺</button>
                </div>
                <div class="meta" id="dimension-count"></div>
                <input class="search" id="dimension-search" type="search" placeholder="筛选子类" oninput="renderDimensionList()">
            </div>
            <div class="nav-list" id="dimension-list"><div class="empty">请先选择大类。</div></div>
        </section>

        <section class="pane editor-pane" id="editor-pane">
            <div class="empty">请选择需要编辑的大类与子类。</div>
        </section>
    </main>

    <script>
        let catalog={groups:[]};
        let defaults={groups:{},dimensions:{}};
        let revision='default';
        let selectedDomainId='';
        let selectedGroupId='';
        let selectedDimensionId='';
        let dirty=false;
        let saving=false;

        function escapeHtml(value){
            return String(value??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
        }
        function currentDomain(){return (catalog.domains||[]).find(domain=>domain.id===selectedDomainId)||null;}
        function groupsForDomain(){const ids=new Set(currentDomain()?.group_ids||[]);return (catalog.groups||[]).filter(group=>ids.has(group.id));}
        function currentGroup(){return (catalog.groups||[]).find(group=>group.id===selectedGroupId)||null;}
        function currentDimension(){return (currentGroup()?.dimensions||[]).find(dim=>dim.id===selectedDimensionId)||null;}
        function setStatus(text,type=''){
            const node=document.getElementById('save-status');
            node.textContent=text;
            node.className=`status ${type}`;
        }
        function markDirty(){
            dirty=true;
            setStatus('有未保存修改','dirty');
        }
        function setCatalog(nextCatalog){
            catalog=nextCatalog||{groups:[]};
            const domains=catalog.domains||[];
            if(!domains.some(domain=>domain.id===selectedDomainId))selectedDomainId=domains[0]?.id||'';
            const groups=groupsForDomain();
            if(!groups.some(group=>group.id===selectedGroupId))selectedGroupId=groups[0]?.id||'';
            const dimensions=currentGroup()?.dimensions||[];
            if(!dimensions.some(dim=>dim.id===selectedDimensionId))selectedDimensionId=dimensions[0]?.id||'';
        }
        function renderAll(){
            const groups=catalog.groups||[];
            const dimensions=groups.reduce((sum,group)=>sum+(group.dimensions||[]).length,0);
            const domains=catalog.domains||[];
            document.getElementById('catalog-count').textContent=`${domains.length} 个评测领域 · ${groups.length} 个大类 · ${dimensions} 个子类`;
            document.getElementById('domain-count').textContent=`${domains.length} 项 · ${domains.reduce((sum,domain)=>sum+Number(domain.dimension_count||0),0)} 个子类`;
            document.getElementById('group-count').textContent=`${groupsForDomain().length} 项`;
            renderDomainList();
            renderGroupList();
            renderDimensionList();
            renderEditor();
        }
        function renderDomainList(){
            const box=document.getElementById('domain-list');
            const domains=catalog.domains||[];
            box.innerHTML=domains.length?domains.map(domain=>`
                <button class="nav-item ${domain.id===selectedDomainId?'active':''}" type="button" onclick="selectDomain('${escapeHtml(domain.id)}')">
                    <span class="nav-name">${escapeHtml(domain.label)}</span>
                    <span class="nav-count">${domain.dimension_count||0} 子类</span>
                </button>`).join(''):'<div class="empty">暂无评测领域。</div>';
        }
        function renderGroupList(){
            const box=document.getElementById('group-list');
            const groups=groupsForDomain();
            box.innerHTML=groups.length?groups.map(group=>`
                <button class="nav-item ${group.id===selectedGroupId?'active':''}" type="button" onclick="selectGroup('${escapeHtml(group.id)}')">
                    <span class="nav-name">${escapeHtml(group.label)}</span>
                    <span class="nav-count">${(group.dimensions||[]).length}</span>
                </button>`).join(''):'<div class="empty">暂无大类。</div>';
        }
        function renderDimensionList(){
            const box=document.getElementById('dimension-list');
            const group=currentGroup();
            const query=(document.getElementById('dimension-search')?.value||'').trim().toLowerCase();
            const all=group?.dimensions||[];
            const rows=all.filter(dim=>!query||String(dim.label||'').toLowerCase().includes(query)||String(dim.name_en||'').toLowerCase().includes(query));
            document.getElementById('dimension-count').textContent=group?`${rows.length} / ${all.length} 项`:'';
            box.innerHTML=rows.length?rows.map(dim=>{
                const index=all.findIndex(item=>item.id===dim.id);
                const locked=Boolean(query);
                return `<div class="dimension-row">
                    <button class="nav-item ${dim.id===selectedDimensionId?'active':''}" type="button" onclick="selectDimension('${escapeHtml(dim.id)}')">
                        <span class="nav-name">${escapeHtml(dim.label)}</span>
                        <span class="nav-count">${(dim.benchmarks||[]).length}</span>
                    </button>
                    <button class="order-button" type="button" title="上移" aria-label="上移 ${escapeHtml(dim.label)}" onclick="moveDimension('${escapeHtml(dim.id)}',-1)" ${locked||index===0?'disabled':''}>↑</button>
                    <button class="order-button" type="button" title="下移" aria-label="下移 ${escapeHtml(dim.label)}" onclick="moveDimension('${escapeHtml(dim.id)}',1)" ${locked||index===all.length-1?'disabled':''}>↓</button>
                </div>`;
            }).join(''):`<div class="empty">${group?'没有匹配的子类。':'请先选择大类。'}</div>`;
        }
        function renderEditor(){
            const box=document.getElementById('editor-pane');
            const group=currentGroup();
            const dim=currentDimension();
            if(!group){box.innerHTML='<div class="empty">暂无可编辑内容。</div>';return;}
            box.innerHTML=`
                <section class="editor-section">
                    <div class="editor-title">
                        <div><h2>大类</h2><div class="identifier">${escapeHtml(group.id)}</div></div>
                        <button class="button" type="button" onclick="resetCurrentGroup()">恢复此大类</button>
                    </div>
                    <div class="field">
                        <label for="group-label">名称 <span class="counter" id="group-label-counter">${String(group.label||'').length} / 120</span></label>
                        <input id="group-label" maxlength="120" value="${escapeHtml(group.label||'')}" oninput="editGroup('label',this.value);updateCounter('group-label-counter',this.value,120)" onblur="renderGroupList()">
                    </div>
                    <div class="field">
                        <label for="group-description">说明 <span class="counter" id="group-description-counter">${String(group.description||'').length} / 8000</span></label>
                        <textarea class="group-description" id="group-description" maxlength="8000" oninput="editGroup('description',this.value);updateCounter('group-description-counter',this.value,8000)">${escapeHtml(group.description||'')}</textarea>
                    </div>
                </section>
                ${dim?`
                <section class="editor-section">
                    <div class="editor-title">
                        <div><h2>子类</h2><div class="identifier">${escapeHtml(dim.id)}</div></div>
                        <button class="button" type="button" onclick="resetCurrentDimension()">恢复此子类</button>
                    </div>
                    <div class="field">
                        <label for="dimension-label">名称 <span class="counter" id="dimension-label-counter">${String(dim.label||'').length} / 120</span></label>
                        <input id="dimension-label" maxlength="120" value="${escapeHtml(dim.label||'')}" oninput="editDimension('label',this.value);updateCounter('dimension-label-counter',this.value,120)" onblur="renderDimensionList()">
                    </div>
                    <div class="field">
                        <label for="dimension-intro">说明 <span class="counter" id="dimension-intro-counter">${String(dim.intro||'').length} / 8000</span></label>
                        <textarea class="dimension-intro" id="dimension-intro" maxlength="8000" oninput="editDimension('intro',this.value);updateCounter('dimension-intro-counter',this.value,8000)">${escapeHtml(dim.intro||'')}</textarea>
                    </div>
                    <div class="benchmarks">
                        <h3>包含的 Benchmark</h3>
                        <div class="benchmark-list">${(dim.benchmarks||[]).map(bench=>`<span class="benchmark-name">${escapeHtml(bench.name||'Benchmark')}</span>`).join('')}</div>
                    </div>
                </section>`:''}`;
        }
        function updateCounter(id,value,max){
            const node=document.getElementById(id);
            if(node)node.textContent=`${String(value||'').length} / ${max}`;
        }
        function editGroup(field,value){
            const group=currentGroup();
            if(!group)return;
            group[field]=value;
            markDirty();
        }
        function editDimension(field,value){
            const dim=currentDimension();
            if(!dim)return;
            dim[field]=value;
            markDirty();
        }
        function selectDomain(id){
            selectedDomainId=id;
            selectedGroupId=groupsForDomain()[0]?.id||'';
            selectedDimensionId=(currentGroup()?.dimensions||[])[0]?.id||'';
            const search=document.getElementById('dimension-search');
            if(search)search.value='';
            renderAll();
        }
        function selectGroup(id){
            selectedGroupId=id;
            selectedDomainId=(catalog.groups||[]).find(group=>group.id===id)?.domain_id||selectedDomainId;
            selectedDimensionId=(currentGroup()?.dimensions||[])[0]?.id||'';
            const search=document.getElementById('dimension-search');
            if(search)search.value='';
            renderAll();
        }
        function selectDimension(id){
            selectedDimensionId=id;
            renderDimensionList();
            renderEditor();
        }
        function moveDimension(id,offset){
            const group=currentGroup();
            const rows=group?.dimensions||[];
            const index=rows.findIndex(dim=>dim.id===id);
            const target=index+offset;
            if(index<0||target<0||target>=rows.length)return;
            const [moved]=rows.splice(index,1);
            rows.splice(target,0,moved);
            selectedDimensionId=id;
            markDirty();
            renderDimensionList();
        }
        function resetDimensionOrder(){
            const group=currentGroup();
            const order=defaults.dimension_order?.[group?.id];
            if(!group||!Array.isArray(order))return;
            const rank=new Map(order.map((id,index)=>[id,index]));
            group.dimensions.sort((left,right)=>(rank.get(left.id)??order.length)-(rank.get(right.id)??order.length));
            markDirty();
            renderDimensionList();
        }
        function resetCurrentGroup(){
            const group=currentGroup();
            const original=defaults.groups?.[group?.id];
            if(!group||!original)return;
            group.label=original.label;
            group.description=original.description;
            markDirty();
            renderAll();
        }
        function resetCurrentDimension(){
            const dim=currentDimension();
            const original=defaults.dimensions?.[dim?.id];
            if(!dim||!original)return;
            dim.label=original.label;
            dim.intro=original.intro;
            markDirty();
            renderAll();
        }
        function savePayload(){
            const groups={};
            const dimensions={};
            const dimension_order={};
            for(const group of catalog.groups||[]){
                groups[group.id]={label:group.label||'',description:group.description||''};
                dimension_order[group.id]=(group.dimensions||[]).map(dim=>dim.id);
                for(const dim of group.dimensions||[]){
                    dimensions[dim.id]={label:dim.label||'',intro:dim.intro||''};
                }
            }
            return {base_revision:revision,groups,dimensions,dimension_order};
        }
        async function requestJson(url,options={}){
            const response=await fetch(url,{cache:'no-store',...options});
            const data=await response.json().catch(()=>({}));
            if(!response.ok){
                const error=new Error(data.error||`请求失败 (${response.status})`);
                error.status=response.status;
                throw error;
            }
            return data;
        }
        async function loadEditor(){
            setStatus('正在读取');
            try{
                const data=await requestJson('/api/taxonomy-editor');
                defaults=data.defaults||{groups:{},dimensions:{}};
                revision=data.revision||'default';
                setCatalog(data.catalog);
                dirty=false;
                setStatus('已同步','saved');
                renderAll();
            }catch(error){
                setStatus(error.message||'读取失败','error');
            }
        }
        async function saveAll(){
            if(saving)return;
            saving=true;
            document.getElementById('save-all').disabled=true;
            setStatus('正在保存');
            try{
                const data=await requestJson('/api/taxonomy-editor',{
                    method:'PUT',
                    headers:{'Content-Type':'application/json'},
                    body:JSON.stringify(savePayload()),
                });
                revision=data.revision||'default';
                setCatalog(data.catalog);
                dirty=false;
                setStatus('已保存并发布','saved');
                renderAll();
            }catch(error){
                setStatus(error.message||'保存失败','error');
                if(error.status===409&&confirm('服务器上的分类内容已经更新。是否放弃当前未保存修改并重新加载？'))loadEditor();
            }finally{
                saving=false;
                document.getElementById('save-all').disabled=false;
            }
        }
        async function resetAll(){
            if(!confirm('确定恢复全部大类、子类名称、说明和顺序吗？'))return;
            try{
                const data=await requestJson('/api/taxonomy-editor',{method:'DELETE'});
                revision=data.revision||'default';
                setCatalog(data.catalog);
                dirty=false;
                setStatus('已恢复默认值','saved');
                renderAll();
            }catch(error){
                setStatus(error.message||'恢复失败','error');
            }
        }
        window.addEventListener('beforeunload',event=>{
            if(!dirty)return;
            event.preventDefault();
            event.returnValue='';
        });
        document.addEventListener('keydown',event=>{
            if((event.ctrlKey||event.metaKey)&&event.key.toLowerCase()==='s'){
                event.preventDefault();
                saveAll();
            }
        });
        loadEditor();
    </script>
</body>
</html>
